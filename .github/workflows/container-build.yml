name: LibRA Container Build

# Staged container build mirroring the gitlab CI pipeline:
#   base -> deps -> components -> tests
# Each stage builds, pushes to Docker Hub, and gates the next.
# CPU-only build (Kokkos OpenMP/Serial backend, LIBRA_ENABLE_CUDA_BACKEND=OFF).
# Runs on the prod-managed ARC runner pool (kubernetes mode, no
# privileged DinD) -- image builds use buildx's kubernetes driver, and the
# test job runs inside the tests image via a job-level container instead of
# `docker run`.
#
# Three execution paths depending on what changed:
#   1. Dockerfile.base or Dockerfile.deps changed -> full rebuild from base
#   2. Any other code changed -> pull existing deps, rebuild components + tests, push, run
#   3. Nothing changed -> pull existing tests image, run

on:
  push:
    branches:
      - container-production
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force a full base -> deps -> components -> tests rebuild, ignoring the diff check"
        type: boolean
        default: false
      build_wheel:
        description: "Build the CPU-only libra-python wheel and upload it as an artifact"
        type: boolean
        default: false
      build_deploy:
        description: "Build the deployment (JupyterHub + wheel + sample data) container -- implies build_wheel"
        type: boolean
        default: false
      use_last_wheel:
        description: "Reuse the most recently uploaded libra-python-wheel-cpu artifact instead of rebuilding the wheel (build-deploy only)"
        type: boolean
        default: false

concurrency:
  group: container-build-${{ github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ardgnrao/libra
  IMAGE_TAG: cpu
  # Sonatype/Nexus mirror for the deploy image only (build-deploy job) --
  # Docker Hub stays the primary/backup push target for every image.
  SONATYPE_REGISTRY: nrao.repo.sonatype.app
  SONATYPE_IMAGE_PREFIX: cicdpilot/releng/libra
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # docker/build-push-action's post-job step generates a build summary by
  # reconnecting to the buildx builder after all explicit steps (including
  # our cleanup step) have run. With the kubernetes driver that reconnection
  # reprovisions a builder pod, which looks like -- and costs as much as --
  # another build. Disable it.
  DOCKER_BUILD_SUMMARY: false

jobs:
  check-changes:
    runs-on:
      group: aws-arc
      labels: aws-arc-runner-lapis-dev
    container:
      image: docker:cli
    outputs:
      base_deps_changed: ${{ steps.filter.outputs.base_deps_changed }}
      any_changed: ${{ steps.filter.outputs.any_changed }}
      skip_chain: ${{ steps.filter.outputs.skip_chain }}
    steps:
      - name: Install git
        run: apk add --no-cache git findutils
      # Checkout and diff computation stay in one step -- see commit message.
      - id: filter
        run: |
          # A workflow_dispatch that asks only for build_wheel/build_deploy
          # (no force_build) skips the diff-based base->deps->components->
          # tests->run-tests chain entirely -- those flags are for a fast,
          # standalone wheel/deploy build, not a full pipeline run.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ github.event.inputs.force_build }}" != "true" ] && \
             { [ "${{ github.event.inputs.build_wheel }}" = "true" ] || \
               [ "${{ github.event.inputs.build_deploy }}" = "true" ] || \
               [ "${{ github.event.inputs.use_last_wheel }}" = "true" ]; }; then
            echo "build_wheel/build_deploy/use_last_wheel requested without force_build -- skipping diff-based chain"
            echo "skip_chain=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_chain=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "force_build requested -- forcing full rebuild"
            echo "base_deps_changed=true" >> "$GITHUB_OUTPUT"
            echo "any_changed=true"       >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config --global --add safe.directory "$PWD"
          git init -q .
          # Same token actions/checkout uses under the hood -- no extra
          # permissions needed, it's auto-issued per-run for this repo.
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git -c protocol.version=2 fetch -q --no-tags --no-recurse-submodules \
            origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"

          head="${{ github.sha }}"
          before="${{ github.event.before }}"

          # before can be present (including the all-zeros SHA on workflow_dispatch/first
          # push, which cat-file will reject same as anything else invalid) but missing
          # locally if it's not an ancestor of the current branch tip (e.g. force-push,
          # rebase). Try to pull just that commit before giving up on it.
          if [ -n "$before" ] && ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "before=$before not present locally -- fetching it explicitly"
            git fetch -q --no-tags origin "$before" 2>/dev/null || true
          fi

          # If before is still unreachable after the explicit fetch above, fall back to
          # head~1. If head~1 also doesn't exist/isn't reachable, default to full build.
          if [ -z "$before" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            if ! git cat-file -e "${head}~1^{commit}" 2>/dev/null; then
              echo "no prior commit reachable -- forcing full rebuild"
              echo "base_deps_changed=true" >> "$GITHUB_OUTPUT"
              echo "any_changed=true"       >> "$GITHUB_OUTPUT"
              exit 0
            fi
            before="${head}~1"
          fi
          base_deps=$(git diff --name-only "$before" "$head" -- \
            scripts/container_recipes/CI/Dockerfile.base \
            scripts/container_recipes/CI/Dockerfile.deps | grep -c . || true)
          any=$(git diff --name-only "$before" "$head" | grep -c . || true)
          echo "before=$before"
          echo "base_deps_changed_count=${base_deps:-0}"
          echo "any_changed_count=${any:-0}"
          if [ "${base_deps:-0}" -gt 0 ]; then
            echo "base_deps_changed=true" >> "$GITHUB_OUTPUT"
            echo "any_changed=true"       >> "$GITHUB_OUTPUT"
          elif [ "${any:-0}" -gt 0 ]; then
            echo "base_deps_changed=false" >> "$GITHUB_OUTPUT"
            echo "any_changed=true"        >> "$GITHUB_OUTPUT"
          else
            echo "base_deps_changed=false" >> "$GITHUB_OUTPUT"
            echo "any_changed=false"       >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------
  # Path 1 only: rebuild base image
  # ----------------------------------------------------------------

  base:
    needs: check-changes
    if: |
      needs.check-changes.outputs.base_deps_changed == 'true' &&
      needs.check-changes.outputs.skip_chain != 'true'
    runs-on:
      group: aws-arc
      labels: aws-arc-runner-lapis-dev
    container:
      image: docker:cli
    steps:
      - name: Install git
        run: apk add --no-cache git findutils
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
        with:
          driver: kubernetes
          driver-opts: |
            rootless=true
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push libra-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/container_recipes/CI/Dockerfile.base
          tags: ${{ env.IMAGE_PREFIX }}-base:${{ env.IMAGE_TAG }}
          push: true
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-base:${{ env.IMAGE_TAG }}-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-base:${{ env.IMAGE_TAG }}-buildcache,mode=min
      - name: Post-job Buildx and Docker Purge
        if: always()
        run: |
          echo "=== Stopping and removing Buildx instances ==="
          docker buildx stop || true
          docker buildx rm --all-inactive --force || true

          echo "=== Pruning dangling build cache ==="
          docker builder prune -f --filter "until=24h" || true

          echo "=== Pruning stopped containers ==="
          docker container prune -f || true

  # ----------------------------------------------------------------
  # Path 1 only: rebuild deps image
  # ----------------------------------------------------------------

  deps:
    needs: [check-changes, base]
    if: |
      needs.check-changes.outputs.base_deps_changed == 'true' &&
      needs.check-changes.outputs.skip_chain != 'true'
    runs-on:
      group: aws-arc
      labels: aws-arc-runner-lapis-dev
    container:
      image: docker:cli
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        with:
          driver: kubernetes
          driver-opts: |
            rootless=true
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push libra-deps
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/container_recipes/CI/Dockerfile.deps
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}-base:${{ env.IMAGE_TAG }}
            nproc=2
          tags: ${{ env.IMAGE_PREFIX }}-deps:${{ env.IMAGE_TAG }}
          push: true
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-deps:${{ env.IMAGE_TAG }}-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-deps:${{ env.IMAGE_TAG }}-buildcache,mode=min
      - name: Post-job Buildx and Docker Purge
        if: always()
        run: |
          echo "=== Stopping and removing Buildx instances ==="
          docker buildx stop || true
          docker buildx rm --all-inactive --force || true

          echo "=== Pruning dangling build cache ==="
          docker builder prune -f --filter "until=24h" || true

          echo "=== Pruning stopped containers ==="
          docker container prune -f || true

  # ----------------------------------------------------------------
  # Paths 1 + 2: rebuild components from deps (freshly built or pulled)
  # ----------------------------------------------------------------

  components:
    needs: [check-changes, deps]
    if: |
      always() &&
      needs.check-changes.outputs.any_changed == 'true' &&
      needs.check-changes.outputs.skip_chain != 'true' &&
      (needs.deps.result == 'success' || needs.deps.result == 'skipped')
    runs-on:
      group: aws-arc
      labels: aws-arc-runner-lapis-dev
    container:
      image: docker:cli
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        with:
          driver: kubernetes
          driver-opts: |
            rootless=true
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push libra-components
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/container_recipes/CI/Dockerfile.components
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}-deps:${{ env.IMAGE_TAG }}
            nproc=2
          tags: ${{ env.IMAGE_PREFIX }}-components:${{ env.IMAGE_TAG }}
          push: true
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-components:${{ env.IMAGE_TAG }}-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-components:${{ env.IMAGE_TAG }}-buildcache,mode=min
      - name: Post-job Buildx and Docker Purge
        if: always()
        run: |
          echo "=== Stopping and removing Buildx instances ==="
          docker buildx stop || true
          docker buildx rm --all-inactive --force || true

          echo "=== Pruning dangling build cache ==="
          docker builder prune -f --filter "until=24h" || true

          echo "=== Pruning stopped containers ==="
          docker container prune -f || true

  # ----------------------------------------------------------------
  # Paths 1 + 2: rebuild tests image from components
  # ----------------------------------------------------------------

  tests:
    needs: [check-changes, components]
    if: |
      always() &&
      needs.check-changes.outputs.any_changed == 'true' &&
      needs.check-changes.outputs.skip_chain != 'true' &&
      needs.components.result == 'success'
    runs-on:
      group: aws-arc
      labels: aws-arc-runner-lapis-dev
    container:
      image: docker:cli
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        with:
          driver: kubernetes
          driver-opts: |
            rootless=true
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push libra-tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/container_recipes/CI/Dockerfile.tests
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}-components:${{ env.IMAGE_TAG }}
          tags: ${{ env.IMAGE_PREFIX }}-tests:${{ env.IMAGE_TAG }}
          push: true
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-tests:${{ env.IMAGE_TAG }}-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-tests:${{ env.IMAGE_TAG }}-buildcache,mode=min
      - name: Post-job Buildx and Docker Purge
        if: always()
        run: |
          echo "=== Stopping and removing Buildx instances ==="
          docker buildx stop || true
          docker buildx rm --all-inactive --force || true

          echo "=== Pruning dangling build cache ==="
          docker builder prune -f --filter "until=24h" || true

          echo "=== Pruning stopped containers ==="
          docker container prune -f || true

  # ----------------------------------------------------------------
  # All paths: run the test suite inside the current tests image.
  # No docker daemon needed -- the job itself runs as that image's
  # container on the runner pod.
  # ----------------------------------------------------------------

  run-tests:
    needs: [check-changes, tests]
    if: |
      always() &&
      needs.check-changes.outputs.skip_chain != 'true' &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on:
      group: aws-arc
      labels: aws-arc-runner-lapis-dev
    container:
      image: ardgnrao/libra-tests:cpu
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Execute test suite
        run: /data/run_tests.sh

  # ----------------------------------------------------------------
  # Manual/flag-gated only: build the CPU-only libra-python wheel.
  # Never runs on a plain push -- only workflow_dispatch with
  # build_wheel=true. Requires run-tests to have passed when the diff
  # chain actually ran (force_build); skipped when build_wheel/build_deploy
  # were requested standalone, so this doesn't wait on it in that case.
  # ----------------------------------------------------------------

  build-wheel:
    needs: [check-changes, run-tests]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.build_wheel == 'true' || github.event.inputs.build_deploy == 'true') &&
      github.event.inputs.use_last_wheel != 'true' &&
      (needs.run-tests.result == 'success' || needs.run-tests.result == 'skipped')
    runs-on:
      group: aws-arc
      labels: aws-arc-runner-lapis-dev
    container:
      image: ardgnrao/libra-deps:cpu
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build CPU wheel
        working-directory: libra-python
        run: |
          python3 -m venv /tmp/wheel_venv
          source /tmp/wheel_venv/bin/activate
          pip install --upgrade pip scikit-build-core pybind11 numpy build patchelf
          export LIBRA_ENABLE_CUDA=OFF
          pip wheel . --no-deps --wheel-dir dist
      # Only one libra-python-wheel-cpu artifact should exist at a time --
      # delete any prior ones before uploading so use_last_wheel always
      # resolves unambiguously to the single most recent build.
      - name: Delete prior wheel artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=libra-python-wheel-cpu&per_page=100" \
            | python3 -c "import json,sys; print('\n'.join(str(a['id']) for a in json.load(sys.stdin)['artifacts']))")
          for id in $ids; do
            echo "Deleting prior wheel artifact $id"
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: libra-python-wheel-cpu
          path: libra-python/dist/*.whl

  # ----------------------------------------------------------------
  # Manual/flag-gated only: build the deployment container (JupyterHub +
  # the CPU wheel + sample data + demo notebook). Never runs on a plain
  # push -- only workflow_dispatch with build_deploy=true.
  # ----------------------------------------------------------------

  build-deploy:
    needs: [build-wheel]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.build_deploy == 'true' || github.event.inputs.use_last_wheel == 'true') &&
      (needs.build-wheel.result == 'success' || needs.build-wheel.result == 'skipped')
    runs-on:
      group: aws-arc
      labels: aws-arc-runner-lapis-dev
    container:
      image: docker:cli
    steps:
      - name: Install curl and python3
        run: apk add --no-cache curl python3
      - uses: actions/checkout@v5
      - name: Find latest wheel artifact
        id: find-wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resp=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=libra-python-wheel-cpu&per_page=1")
          run_id=$(echo "$resp" | python3 -c "import json,sys; a=json.load(sys.stdin)['artifacts']; print(a[0]['workflow_run']['id'] if a else '')")
          if [ -z "$run_id" ]; then
            echo "No libra-python-wheel-cpu artifact found -- run build_wheel first" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v6
        with:
          name: libra-python-wheel-cpu
          run-id: ${{ steps.find-wheel.outputs.run_id }}
          path: scripts/container_recipes/CI
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - uses: docker/setup-buildx-action@v4
        with:
          driver: kubernetes
          driver-opts: |
            rootless=true
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.SONATYPE_REGISTRY }}
          username: ${{ secrets.SONATYPE_USERNAME }}
          password: ${{ secrets.SONATYPE_TOKEN }}
      - name: Build & push libra-deploy
        uses: docker/build-push-action@v6
        with:
          context: scripts/container_recipes/CI
          file: scripts/container_recipes/CI/Dockerfile.deploy
          tags: |
            ${{ env.IMAGE_PREFIX }}-deploy:${{ env.IMAGE_TAG }}
            ${{ env.SONATYPE_REGISTRY }}/${{ env.SONATYPE_IMAGE_PREFIX }}:${{ env.IMAGE_TAG }}
          push: true
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-deploy:${{ env.IMAGE_TAG }}-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-deploy:${{ env.IMAGE_TAG }}-buildcache,mode=min
      - name: Post-job Buildx and Docker Purge
        if: always()
        run: |
          echo "=== Stopping and removing Buildx instances ==="
          docker buildx stop || true
          docker buildx rm --all-inactive --force || true

          echo "=== Pruning dangling build cache ==="
          docker builder prune -f --filter "until=24h" || true

          echo "=== Pruning stopped containers ==="
          docker container prune -f || true
