name: LibRA Container Build

# Staged container build mirroring the gitlab CI pipeline:
#   base -> deps -> components -> tests
# Each stage builds, pushes to Docker Hub, and gates the next.
# Runs on a self-hosted runner with a privileged DinD sidecar; see
# scripts/runner/ for the runner-side topology.
#
# Three execution paths depending on what changed:
#   1. Dockerfile.base or Dockerfile.deps changed -> full rebuild from base
#   2. Any other code changed -> pull existing deps, rebuild components + tests, push, run
#   3. Nothing changed -> pull existing tests image, run

on:
  push:
    branches:
      - container-production
  workflow_dispatch:
    inputs:
      arch:
        description: "Kokkos CUDA arch"
        required: true
        default: VOLTA70
        type: choice
        options: [VOLTA70, AMPERE80, HOPPER90]

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ardgnrao/libra
  ARCH: ${{ inputs.arch || 'VOLTA70' }}

jobs:
  check-changes:
    runs-on: libra-dind
    outputs:
      base_deps_changed: ${{ steps.filter.outputs.base_deps_changed }}
      any_changed: ${{ steps.filter.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: filter
        run: |
          before="${{ github.event.before }}"
          # On workflow_dispatch or first push, before is all zeros -- fall back to HEAD~1.
          # If HEAD~1 also doesn't exist (first commit ever), default to full build.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            if ! git rev-parse HEAD~1 &>/dev/null; then
              echo "base_deps_changed=true" >> "$GITHUB_OUTPUT"
              echo "any_changed=true"       >> "$GITHUB_OUTPUT"
              exit 0
            fi
            before="HEAD~1"
          fi
          base_deps=$(git diff --name-only "$before" HEAD -- \
            scripts/container_recipes/CI/Dockerfile.base \
            scripts/container_recipes/CI/Dockerfile.deps | grep -c . || true)
          any=$(git diff --name-only "$before" HEAD | grep -c . || true)
          if [ "${base_deps:-0}" -gt 0 ]; then
            echo "base_deps_changed=true" >> "$GITHUB_OUTPUT"
            echo "any_changed=true"       >> "$GITHUB_OUTPUT"
          elif [ "${any:-0}" -gt 0 ]; then
            echo "base_deps_changed=false" >> "$GITHUB_OUTPUT"
            echo "any_changed=true"        >> "$GITHUB_OUTPUT"
          else
            echo "base_deps_changed=false" >> "$GITHUB_OUTPUT"
            echo "any_changed=false"       >> "$GITHUB_OUTPUT"
          fi

  set-cuda:
    needs: check-changes
    runs-on: libra-dind
    outputs:
      arch_lower: ${{ steps.compute.outputs.arch_lower }}
      cuda_version: ${{ steps.compute.outputs.cuda_version }}
    steps:
      - id: compute
        run: |
          arch="${ARCH}"
          case "$arch" in
            VOLTA70)              cuda="12.9.1" ;;
            AMPERE80|AMPERE86)    cuda="13.2.1" ;;
            HOPPER90)             cuda="13.2.1" ;;
            *) echo "Unknown arch: $arch" >&2; exit 1 ;;
          esac
          arch_lower=$(echo "$arch" | tr '[:upper:]' '[:lower:]')
          echo "arch_lower=$arch_lower" >> "$GITHUB_OUTPUT"
          echo "cuda_version=$cuda"     >> "$GITHUB_OUTPUT"
          echo "Building for arch=$arch (tag=$arch_lower), CUDA=$cuda"

  # ----------------------------------------------------------------
  # Path 1 only: rebuild base image
  # ----------------------------------------------------------------

  base:
    needs: [check-changes, set-cuda]
    if: needs.check-changes.outputs.base_deps_changed == 'true'
    runs-on: libra-dind
    env:
      ARCH_LOWER:   ${{ needs.set-cuda.outputs.arch_lower }}
      CUDA_VERSION: ${{ needs.set-cuda.outputs.cuda_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
          install: true
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push libra-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/container_recipes/CI/Dockerfile.base
          build-args: |
            CUDA_VERSION=${{ env.CUDA_VERSION }}
          tags: ${{ env.IMAGE_PREFIX }}-base:${{ env.ARCH_LOWER }}
          push: true

  # ----------------------------------------------------------------
  # Path 1 only: rebuild deps image
  # ----------------------------------------------------------------

  deps:
    needs: [check-changes, set-cuda, base]
    if: needs.check-changes.outputs.base_deps_changed == 'true'
    runs-on: libra-dind
    env:
      ARCH_LOWER: ${{ needs.set-cuda.outputs.arch_lower }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
          install: true
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push libra-deps
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/container_recipes/CI/Dockerfile.deps
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}-base:${{ env.ARCH_LOWER }}
            CUDA_ARCH=${{ env.ARCH }}
            nproc=8
          tags: ${{ env.IMAGE_PREFIX }}-deps:${{ env.ARCH_LOWER }}
          push: true

  # ----------------------------------------------------------------
  # Paths 1 + 2: rebuild components from deps (freshly built or pulled)
  # ----------------------------------------------------------------

  components:
    needs: [check-changes, set-cuda, deps]
    if: |
      always() &&
      needs.set-cuda.result == 'success' &&
      needs.check-changes.outputs.any_changed == 'true' &&
      (needs.deps.result == 'success' || needs.deps.result == 'skipped')
    runs-on: libra-dind
    env:
      ARCH_LOWER: ${{ needs.set-cuda.outputs.arch_lower }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
          install: true
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push libra-components
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/container_recipes/CI/Dockerfile.components
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}-deps:${{ env.ARCH_LOWER }}
            nproc=8
          tags: ${{ env.IMAGE_PREFIX }}-components:${{ env.ARCH_LOWER }}
          push: true

  # ----------------------------------------------------------------
  # Paths 1 + 2: rebuild tests image from components
  # ----------------------------------------------------------------

  tests:
    needs: [check-changes, set-cuda, components]
    if: |
      always() &&
      needs.set-cuda.result == 'success' &&
      needs.check-changes.outputs.any_changed == 'true' &&
      needs.components.result == 'success'
    runs-on: libra-dind
    env:
      ARCH_LOWER: ${{ needs.set-cuda.outputs.arch_lower }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
          install: true
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push libra-tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/container_recipes/CI/Dockerfile.tests
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}-components:${{ env.ARCH_LOWER }}
          tags: ${{ env.IMAGE_PREFIX }}-tests:${{ env.ARCH_LOWER }}
          push: true

  # ----------------------------------------------------------------
  # All paths: pull whatever tests image is current and run the suite
  # ----------------------------------------------------------------

  run-tests:
    needs: [set-cuda, tests]
    if: |
      always() &&
      needs.set-cuda.result == 'success' &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on: libra-dind
    env:
      ARCH_LOWER: ${{ needs.set-cuda.outputs.arch_lower }}
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull libra-tests
        run: docker pull ${{ env.IMAGE_PREFIX }}-tests:${{ env.ARCH_LOWER }}
      - name: Execute test suite
        run: |
          docker run --rm --privileged -e NVIDIA_VISIBLE_DEVICES=all \
            ${{ env.IMAGE_PREFIX }}-tests:${{ env.ARCH_LOWER }}
