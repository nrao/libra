contextPath: "/"

replicaCount: 1

image:
  repository: ""
  pullPolicy: Always
  tag: "latest"

imageCredentials: {}
  # registry: nrao.repo.sonatype.app
  # username: someone
  # password: token

imagePullSecrets: []

## Required -- deployment fails to template without it. Set via an
## encrypted values file, never committed in plaintext.
jupyterToken: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 8888

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    # - host: libra.nrao.casa
    #   paths:
    #     - path: /
    #       pathType: Prefix
  tls: []

resources: {}
